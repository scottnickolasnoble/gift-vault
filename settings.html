			<header>
				<h1>Settings</h1>
			</header>
			
			<section class="settings-card">
			<span class="settings-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
			</span>
				<h2>Back up your vault</h2>
				<p>Download a file with all your people and ideas. Keep it somewhere safe like your email or cloud storage</p>
				<button class="save-person" type="button" id="export-button">Export Backup</button>
			</section>
			<section class="settings-card">
			<span class="settings-icon settings-icon-quiet">

			</span>
				<h2>Restore from a backup</h2>
				<p>Load a backup file. This replaces everything currently saved in this browser.</p>
				<button class="import-people" type="button" id="import-button">Import Backup</button>
				<input type="file" id="import-file" accept=".json" hidden>
			</section>
