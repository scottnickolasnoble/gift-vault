	<body>

		<main>
			<header class="home-header">
				<h1 id="greeting">Hello</h1>
				<p class="home-date" id="home-date"></p>
			</header>
			<p class="hidden-empty-state" id="home-empty" hidden>Add the people you buy for, and Gift Vault will keep track of what's coming up.<br><a class="text-link" href="person-form.html">Add your first person</a></p>

			<section class="home-section" id="next-section" hidden>
				<h2 class="home-label">Next up</h2>
				<a class="next-card" id="next-card" href="occasions.html">
					<span class="date-box date-box-large" id="next-date-box">
						<span class="date-month" id="next-month"></span>
						<span class="date-day" id="next-day"></span>
					</span>
					<span class="next-info">
						<span class="next-title" id="next-title"></span>
						<span class="next-when" id="next-when"></span>
						<span class="next-detail" id="next-detail"></span>
						<span class="progress-bar" id="next-bar" hidden><span class="progress-bar-fill" id="next-bar-fill"></span></span>
					</span>
				</a>
			</section>

			<section class="home-section" id="coming-section" hidden>
				<h2 class="home-label">Coming up</h2>
				<ul class="occasion-list" id="coming-list"></ul>
			</section>

			<section class="home-section" id="needs-section" hidden>
				<h2 class="home-label">Needs a gift · next 30 days</h2>
				<ul class="needs-list" id="needs-list"></ul>
				<p class="home-note" id="needs-none" hidden>Everyone's covered for the next 30 days.</p>
			</section>

			<div class="quick-actions">
				<a class="save-person button-link" href="idea-form.html">+ Add idea</a>
				<a class="import-people button-link" href="person-form.html">Add person</a>
			</div>
		</main>
