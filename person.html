<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Person</title>
		
		<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/styles.css">
		<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#F5F0E8">
	<link rel="icon" type="image/png" href="icons/favicon-32.png">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="Gift Vault">
	</head>
	<body>
		<main>
			<div class="top-bar">
				<a href="index.html" class="back-link">

				<button type="button" class="edit-button" id="person-edit-button">Edit</button>
			</div>
			<header class="person-header" id="person-header">

						<span id="person-details"></span>

			</header>
			<section class="ideas-section">
				<div class="section-header">
					<h2 id="idea-header">Ideas</h2>
					<a href="idea-form.html" id="add-idea-link">+ Add idea</a>
				</div>
				<div id="ideas-list">
					
				</div>
				<p class="ideas-empty" hidden id="ideas-empty">No ideas yet for this person</p>
			</section>
		</main>
	<script src="js/storage.js"></script>
	<script src="js/dates.js"></script>
	<script src="js/person.js"></script>
